services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: eaics
      POSTGRES_PASSWORD: eaics
      POSTGRES_DB: eaics
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eaics -d eaics"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: eaics
      MINIO_ROOT_PASSWORD: eaics-secret-ganti-di-lokal
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
  api:
    build: .
    ports: ["8000:8000"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://eaics:eaics@postgres:5432/eaics
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
  sim-crm:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8102
    ports: ["8102:8102"]
volumes:
  pgdata: {}
  miniodata: {}
